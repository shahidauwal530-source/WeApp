name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Ensure google-services.json
        run: |
          if [ ! -f app/google-services.json ]; then
            python3 -c 'import json; json.dump({"project_info":{"project_number":"000000000000","project_id":"weapp-placeholder","storage_bucket":"weapp-placeholder.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.aistudio.weapp.knwxqz"}},"oauth_client":[{"client_id":"000000000000-placeholder.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyPlaceholderKeyForCiBuildOnly0000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}, open("app/google-services.json","w"), indent=2)'
          fi
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '9.3.1'
          arguments: assembleDebug --stacktrace --no-configuration-cache
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
